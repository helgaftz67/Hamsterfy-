name: Windows build

on:
  push:
    branches:
      - main
      - claude/music-app-design-refs-ryxi1e
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.1
          cache: true
      - run: flutter pub get
      - run: flutter test
      - run: flutter build windows --release
      # The search index needs SQLite next to the program: a clean Windows
      # has none. Fail the build if the library was not bundled.
      - name: Check that SQLite is bundled
        shell: pwsh
        run: |
          $found = Get-ChildItem -Recurse build/windows/x64/runner/Release -Include *sqlite*
          $found | ForEach-Object { "{0}  {1} bytes" -f $_.FullName, $_.Length }
          if (-not $found) { Write-Error "No SQLite library in the release folder"; exit 1 }
      # Opens the index inside the real app on Windows, so a library that is
      # present but does not load is caught here too.
      - name: Open the search index in the Windows app
        run: flutter test integration_test/local_index_test.dart -d windows
      - uses: actions/upload-artifact@v4
        with:
          name: Hamsterfy-windows
          path: build/windows/x64/runner/Release
          if-no-files-found: error
      # The server's control panel is the same project with another entry
      # point. It opens as a wide desktop window rather than a phone-sized one.
      - name: Build the server control panel
        shell: pwsh
        run: |
          $runner = 'windows/runner/main.cpp'
          $code = Get-Content $runner -Raw
          if ($code -notmatch 'Size size\(480, 900\)') { Write-Error 'Window size line not found'; exit 1 }
          $code.Replace('Size size(480, 900)', 'Size size(1180, 780)').Replace('L"Hamsterfy"', 'L"Hamsterfy Server"') | Set-Content $runner
          flutter build windows --release -t lib/server_panel/main.dart
          git checkout -- $runner
      - uses: actions/upload-artifact@v4
        with:
          name: Hamsterfy-Server-Panel-windows
          path: build/windows/x64/runner/Release
          if-no-files-found: error
      - run: dart build cli --target bin/server.dart -o server-build
      - uses: actions/upload-artifact@v4
        with:
          name: Hamsterfy-server-windows
          path: server-build/bundle
          if-no-files-found: error
